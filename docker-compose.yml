version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: cvstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvstack
      POSTGRES_PASSWORD: cvstack
      POSTGRES_DB: cvstack
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cvstack -d cvstack']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
